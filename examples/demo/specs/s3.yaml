# The matching CSV files, read from s3://demo-bucket.
# The test uploads examples/demo/data/match to moto. This spec does not call AWS.
# TODO(key-diff): the key diff and row hashes PR will hash these columns
# per txn_id. This pair matches, so that check will have nothing to list.
version: 1

source:
  path: s3://demo-bucket/payments/match/source.csv
  format: csv

target:
  path: s3://demo-bucket/payments/match/target.csv
  format: csv

keys: [txn_id]

amounts:
  - column: amount
    scale: 2

group_by: [txn_date]

hash_columns: [account_id, txn_type, amount, currency, txn_date]

tolerance:
  value: "0"
  reason: ""

sampled: false

allowlist: ["s3://demo-bucket"]
