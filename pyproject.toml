[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qa-core-recon"
dynamic = ["version"]
description = "Prove a target dataset matches its source after a Glue or PySpark job."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
qa-core-recon = "qa_core_recon.cli:main"

[tool.hatch.version]
path = "src/qa_core_recon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_core_recon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
