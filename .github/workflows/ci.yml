name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/qa-core-recon/ivy
          key: ivy-iceberg-1.7.1-hadoop-aws-3.3.4-aws-sdk-1.12.262-${{ runner.os }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_distributions.py
